name: external_app_launcher
description: A Flutter Android plugin for launching external apps with ACTION_VIEW deeplinks in a new task.
version: 0.0.1
homepage:

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.external_app_launcher
        pluginClass: ExternalAppLauncherPlugin
